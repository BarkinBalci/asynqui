# asynqui example configuration. Every key is shown with its default, and the
# file loads as is, without any environment variables.
# Reference: docs/requirements.md §8.
#
# Values can use ${NAME} (unset is an error) and ${NAME:-default}. $$ is a
# literal "$"; any other "$" is kept, so bcrypt hashes need no escaping.

server:
  addr: ":8080"
  # Serve under a sub-path, e.g. "/asynq", probes and static files included.
  base_path: ""
  # Readiness reports 503 for this long before the listener closes; 0 disables.
  # See docs/deployment.md.
  shutdown_delay: 5s
  # Extra origins allowed to send POSTs, e.g. ["https://ops.example.com"].
  trusted_origins: []

log:
  level: info            # debug | info | warn | error

# Initial auto-refresh for new visitors: off | 2s | 5s | 10s.
refresh:
  default: 5s

# Check GitHub for a newer release.
update_check: true

# Each connection is a Redis address plus a logical DB. Names are unique,
# match ^[a-z0-9][a-z0-9._-]{0,62}$ and appear in URLs and authz rules.
connections:
  - name: local
    addr: localhost:6379
    db: 0
    username: ""                          # Redis ACL user
    password: ${LOCAL_REDIS_PASSWORD:-}   # empty when the variable is unset
    tls:
      enabled: false
      ca_file: ""                # empty: system roots
      cert_file: ""              # client certificate (mutual TLS); with key_file
      key_file: ""
      server_name: ""            # overrides SNI and the verified name
      insecure_skip_verify: false
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s

  # Same instance, another logical DB.
  - name: local-jobs
    addr: localhost:6379
    db: 3

# Provider: none | basic | proxy | oidc. Keep inactive provider blocks
# commented out: their ${...} values are still interpolated, and an unset
# variable is an error.
auth:
  provider: none

  # Session cookie (basic and oidc). Generate each key with: openssl rand -hex 32
  # session:
  #   hash_key: ${ASYNQUI_SESSION_HASH_KEY}
  #   block_key: ${ASYNQUI_SESSION_BLOCK_KEY}
  #   previous_keys: []      # [{hash_key: ..., block_key: ...}], decode only
  #   ttl: 12h               # absolute
  #   cookie_secure: true    # false only for local plain http

  # provider: basic. bcrypt hashes (max 72-byte passwords):
  #   htpasswd -nbBC 12 "" 'secret' | cut -d: -f2
  # basic:
  #   users:
  #     - username: jdoe
  #       password_hash: "$2y$12$<53 chars from htpasswd>"
  #       groups: [payments-team]

  # provider: proxy. The proxy must strip client identity headers; see
  # docs/deployment.md.
  # proxy:
  #   user_header: X-Forwarded-User
  #   groups_header: ""              # e.g. X-Forwarded-Groups (comma-separated)
  #   trusted_proxies: [10.0.0.10/32]
  #   logout_url: ""                 # empty hides Sign out

  # provider: oidc. Register https://<host><base_path>/auth/callback at the IdP.
  # oidc:
  #   issuer: https://login.example.com/realms/acme
  #   client_id: asynqui
  #   client_secret: ${ASYNQUI_OIDC_CLIENT_SECRET}   # empty for public clients
  #   redirect_url: https://asynqui.example.com/auth/callback
  #   scopes: [openid, profile, email]               # add groups if your IdP needs it
  #   username_claim: email                          # email requires email_verified
  #   groups_claim: groups

# Roles per connection: viewer < operator < admin (docs/requirements.md §4).
# A user's role is the highest of `default` and every matching binding.
authz:
  # Defaults to viewer with provider none, otherwise none. Set admin for full
  # control without login.
  default: viewer          # none | viewer | operator | admin
  # With provider none, bindings never match.
  bindings: []
  #  - groups: [platform]
  #    role: admin
  #    connections: ["*"]
  #  - groups: [payments-team]
  #    role: operator
  #    connections: ["local", "local-*"]
  #  - users: [jdoe@example.com]
  #    role: operator
  #    connections: ["local-jobs"]
