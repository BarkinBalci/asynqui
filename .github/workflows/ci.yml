name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Oldest supported minor; go.mod's toolchain line pins the patch floor.
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: templ generate is up to date
        run: |
          go tool -modfile=tools/go.mod templ generate
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: vet
        run: go vet ./...
      - name: lint
        run: go tool -modfile=tools/go.mod golangci-lint run
      - name: test
        # ubuntu runners ship Docker (testcontainers) and gcc (-race needs cgo).
        # ASYNQUI_REQUIRE_DOCKER fails the integration tests instead of
        # skipping them when Docker is missing, so the asynq key layout
        # test (TestIntegrationKeys) always runs here.
        env:
          ASYNQUI_REQUIRE_DOCKER: '1'
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/asynqui
