name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the sidebar footer, or printed by `-version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Anything that might matter, such as how you run it, the Redis or Valkey version, the asynq version your workers use, or the auth provider.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets such as passwords, tokens and session keys first.
      render: shell
