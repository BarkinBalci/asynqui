name: Feature request
description: Suggest something asynqui should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: limitations
    attributes:
      label: Limitations
      description: Some things asynq doesn't support, so asynqui can't either.
      options:
        - label: I checked the README's [Limitations](https://github.com/BarkinBalci/asynqui#limitations) section
          required: false
