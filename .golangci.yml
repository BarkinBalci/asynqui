version: "2"

run:
  build-tags: [e2e, demo] # lint the browser tests and the demo GIF generator too

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unparam
    - nilerr
    - noctx
    - contextcheck
    - copyloopvar
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: unused-parameter
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/BarkinBalci/asynqui]
